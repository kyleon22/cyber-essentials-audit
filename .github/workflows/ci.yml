name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and test (Windows PowerShell ${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pwsh = PowerShell 7; powershell = Windows PowerShell 5.1 (the tool
        # must keep running on domain controllers).
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned dependencies
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.25.0 -Scope CurrentUser -Force -AllowClobber
          Install-Module ImportExcel -RequiredVersion 7.8.10 -Scope CurrentUser -Force -AllowClobber
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 |
            Where-Object { $_.ScriptName -notlike '*.Tests.ps1' }
          $results | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          if (@($results | Where-Object Severity -in @('Error','Warning')).Count -gt 0) {
            throw "PSScriptAnalyzer reported $(@($results).Count) finding(s)."
          }

      - name: Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = '.\Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: testResults.xml

  package:
    name: Package release zip
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $staging = New-Item -ItemType Directory -Path .\dist\CyberEssentialsAudit-$version
          Copy-Item .\CyberEssentialsAudit -Destination $staging -Recurse
          Copy-Item .\Start-CyberEssentialsAudit.ps1, .\README.md, .\SECURITY.md, .\CHANGELOG.md -Destination $staging
          Compress-Archive -Path "$staging\*" -DestinationPath ".\dist\CyberEssentialsAudit-$version.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
